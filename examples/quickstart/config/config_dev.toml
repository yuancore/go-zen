#系统配置
[system]
#启动地址
listen = "2048"
#项目名称
app_name = "gozen"
#是否开发调试模式
debug = true


#接口请求日志
[log]
#路径
path = "./log/app.log"
#输出格式 支持(json、console)
format = "json"
#日志服务名称
service_name = "go-zen"
#日志输出等级 all、info、warn、error、debug、dpanic、panic、fatal
level = "all"
#是否输出控制台
console = true
#是否开启日志
switch = true
#文件最长保存时间(天)
max_age = 180
#分割大小(MB)
max_size = 50
#保留30个备份(个)
max_backups = 100
#是否需要压缩
compress = false

#请求日志配置
[http_log]
#是否开启
enabled = true
#请求头白名单
header_whitelist = ["*"]
#记录请求请求Body
request_body = true
#是否打印响应主体
response_body = true
#跳过路由打印
skip_paths = []

[cors]
enable = true
allow_origins = ["*"]          # 生产环境应指定具体域名
allow_methods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
allow_headers = ["Origin", "Content-Type", "Authorization"]

#数据库设置
[[connections]]
#数据库名称(必须唯一)
name = "mysql"
#数据库类型支持mysql、pgsql、sqlsrv、clickhouse
type = "mysql"
#服务器地址
#服务器地址
hostname = "127.0.0.1"
#服务器端口
port = 3306
#数据库用户名
username = "root"
#数据库密码
password = "root"
#数据库名
database = "admin"
#数据库连接参数
params = "charset=utf8mb4&collation=utf8mb4_bin&parseTime=True&loc=Local&timeout=30s&readTimeout=60s&writeTimeout=60s"
#是否开启日志
log = true
#设置空闲连接池中的最大连接数
max_idle_conns = 100
#设置数据库的最大打开连接数。
max_open_conns = 200
#设置连接可能被重用的最大时间(秒)。
conn_max_lifetime = 1800
#设置连接最大生命周期(小时)。
conn_max_idle_time = 1
#日志等级,1=静默;2=错误;3=警告;4=信息
level = 4

#Redis配置 — 支持多实例，启动时自动 Ping，连接失败则退出
#第一个实例自动作为默认实例（通过 zredis.Cache(app) 获取）
#其他实例通过名称获取（通过 zredis.CacheNamed(app, "session") 获取）
[[redis]]
name = "redis"
address = "127.0.0.1:6379"
password = "pi3.1415926222"
db = 0
pool_size = 10      # 连接池大小，默认 10
ping_timeout = 5    # 启动连接检测超时(秒)，默认 5；设为 -1 禁用

