# 系统配置
[system]
address    = "9000"
cors       = true
debug      = true
app_name   = "go-zen-quickstart"
request_body_limit_bytes = 1048576  # 1 MiB

# 日志配置
[log]
path           = "./log/app.log"
format         = "json"           # json | console
service_name   = "go-zen-quickstart"
level          = "info"           # debug | info | warn | error
console        = true
switch         = true
max_age        = 30
max_size       = 100
max_backups    = 30
compress       = false
skip_paths     = []

# 数据库配置
# go-zen 同时支持两种写法：
#   A. [database] + [[database.connections]]  (推荐)
#   B. [[connections]]                         (antgo 兼容)
[database]
default      = "main"
prepare_stmt = true
skip_default_transaction = true

  [database.logger]
  enabled              = true
  level                = "warn"
  slow_threshold_millis = 200

  [[database.connections]]
  name     = "main"
  driver   = "mysql"
  host     = "127.0.0.1"
  port     = 3306
  username = "root"
  password = "root"
  database = "loan_dev"
  params   = "charset=utf8mb4&parseTime=True&loc=Local&timeout=10s"
  max_idle_conns        = 10
  max_open_conns        = 100
  conn_max_lifetime     = 3600
  conn_max_idle_time    = 600
